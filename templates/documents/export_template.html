<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<style>
    @font-face {
        font-family: 'NotoBengali';
        src: url('file://{{ font_path }}');
    }
    body {
        margin: 0;
        font-family: 'NotoBengali', sans-serif;
    }
    .page {
        position: relative;
        width: {{ image_width }}px;
        height: {{ image_height }}px;
    }
    .page img {
        width: 100%;
        height: 100%;
    }
    .text-block {
        position: absolute;
        background: white;
        white-space: pre-wrap;
        line-height: 1.1;
    }
</style>
</head>
<body>
    <div class="page">
        <img src="{{ image_url }}">

        {% for element in elements %}
            {% if element.type == 'cover' %}
                <div style="position:absolute; left:{{ element.left }}px; top:{{ element.top }}px; width:{{ element.width }}px; height:{{ element.height }}px; background:white;"></div>
            {% elif element.type == 'image' %}
                <img src="{{ element.src }}" style="position:absolute; left:{{ element.left }}px; top:{{ element.top }}px; width:{{ element.width }}px; height:{{ element.height }}px; object-fit:contain;">
            {% elif element.type == 'text' %}
                <div style="position:absolute; left:{{ element.left }}px; top:{{ element.top }}px; width:{{ element.width }}px; height:{{ element.height }}px; font-size:{{ element.font_size }}px; color:{{ element.color }}; white-space:pre-wrap;">{{ element.text }}</div>
            {% endif %}
        {% endfor %}

        {% for block in blocks %}
        <div class="text-block" style="left:{{ block.left }}px; top:{{ block.top }}px; width:{{ block.width }}px; height:{{ block.height }}px; font-size:{{ block.height }}px;">
            {{ block.text }}
        </div>
        {% endfor %}
    </div>
</body>
</html>
