<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<style>
    @font-face {
        font-family: 'NotoBengali';
        src: url('file://{{ font_path }}');
    }
    body {
        margin: 0;
        font-family: 'NotoBengali', sans-serif;
    }
    .page {
        position: relative;
        width: {{ image_width }}px;
        height: {{ image_height }}px;
    }
    .page img {
        width: 100%;
        height: 100%;
    }
    .text-block {
        position: absolute;
        background: white;
        white-space: pre-wrap;
        line-height: 1.1;
    }
</style>
</head>
<body>
    <div class="page">
        <img src="{{ image_url }}">
        {% for block in blocks %}
        <div class="text-block" style="left:{{ block.left }}px; top:{{ block.top }}px; width:{{ block.width }}px; height:{{ block.height }}px; font-size:{{ block.height }}px;">
            {{ block.text }}
        </div>
        {% endfor %}
    </div>
</body>
</html>
