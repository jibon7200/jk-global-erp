<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<style>
    @font-face {
        font-family: 'NotoBengali';
        src: url('file://{{ font_path }}');
    }
    @page {
        size: {{ page_width }}pt {{ page_height }}pt;
        margin: 0;
    }
    body { margin: 0; font-family: 'NotoBengali', sans-serif; }
    .page {
        position: relative;
        width: {{ page_width }}pt;
        height: {{ page_height }}pt;
    }
    .page img { width: 100%; height: 100%; display: block; }
    .element {
        position: absolute;
        white-space: pre-wrap;
        line-height: 1.1;
    }
</style>
</head>
<body>
    <div class="page">
        <img src="{{ image_data_uri }}">

        {% for el in elements %}
            {% if el.type == 'cover' %}
                <div class="element" style="left:{{ el.left }}pt; top:{{ el.top }}pt; width:{{ el.width }}pt; height:{{ el.height }}pt; background:{{ el.color|default:"white" }}; opacity:{{ el.opacity|default:"1" }}; transform:rotate({{ el.rotation|default:"0" }}deg);"></div>
            {% elif el.type == 'image' %}
                <img class="element" src="{{ el.src }}" style="left:{{ el.left }}pt; top:{{ el.top }}pt; width:{{ el.width }}pt; height:{{ el.height }}pt; object-fit:contain; opacity:{{ el.opacity|default:"1" }}; transform:rotate({{ el.rotation|default:"0" }}deg);">
            {% elif el.type == 'rect' %}
                <div class="element" style="left:{{ el.left }}pt; top:{{ el.top }}pt; width:{{ el.width }}pt; height:{{ el.height }}pt; background:{{ el.color|default:"#3b82f6" }}; opacity:{{ el.opacity|default:"1" }}; transform:rotate({{ el.rotation|default:"0" }}deg);"></div>
            {% elif el.type == 'circle' %}
                <div class="element" style="left:{{ el.left }}pt; top:{{ el.top }}pt; width:{{ el.width }}pt; height:{{ el.height }}pt; background:{{ el.color|default:"#3b82f6" }}; border-radius:50%; opacity:{{ el.opacity|default:"1" }}; transform:rotate({{ el.rotation|default:"0" }}deg);"></div>
            {% elif el.type == 'line' %}
                <div class="element" style="left:{{ el.left }}pt; top:{{ el.top }}pt; width:{{ el.width }}pt; height:2pt; background:{{ el.color|default:"#000000" }}; opacity:{{ el.opacity|default:"1" }}; transform:rotate({{ el.rotation|default:"0" }}deg);"></div>
            {% elif el.type == 'text' %}
                <div class="element" style="left:{{ el.left }}pt; top:{{ el.top }}pt; width:{{ el.width }}pt; height:{{ el.height }}pt; font-size:{{ el.font_size }}pt; color:{{ el.color|default:"#000000" }}; opacity:{{ el.opacity|default:"1" }}; transform:rotate({{ el.rotation|default:"0" }}deg);">{{ el.text }}</div>
            {% endif %}
        {% endfor %}


    </div>
</body>
</html>
