{% extends 'base.html' %}
{% block title %}Add Supplier{% endblock %}
{% block page_title %}Payable — Add Supplier{% endblock %}
{% block content %}
    <div class="card" style="max-width:480px;">
        <form method="post">
            {% csrf_token %}
            <div style="margin-bottom:18px;"><label style="display:block; font-size:13px; font-weight:600; color:#334155; margin-bottom:6px;">Supplier/Partner Name</label>{{ form.name }}</div>
            <div style="margin-bottom:18px;"><label style="display:block; font-size:13px; font-weight:600; color:#334155; margin-bottom:6px;">Phone Number</label>{{ form.phone_number }}</div>
            <div style="margin-bottom:22px;"><label style="display:block; font-size:13px; font-weight:600; color:#334155; margin-bottom:6px;">Notes</label>{{ form.notes }}</div>
            <button type="submit" style="background:#1e3a5f; color:#fff; padding:11px 22px; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;">Add Supplier</button>
            <a href="{% url 'payable:supplier_list' %}" style="background:#e2e8f0; color:#334155; padding:11px 22px; border-radius:8px; text-decoration:none; font-size:14px; font-weight:600;">Cancel</a>
        </form>
    </div>
    <style>.form-input,input,textarea{width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;}</style>
{% endblock %}
